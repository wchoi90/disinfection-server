<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>바코드 스캔 테스트</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial,sans-serif;
  margin:20px;
  background:#f5f5f5;
}

.container{
  max-width:600px;
  margin:auto;
}

h2{
  text-align:center;
}

button{
  width:100%;
  padding:16px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:#16a34a;
  color:white;
  cursor:pointer;
}

#reader{
  margin-top:20px;
  width:100%;
}

.result{
  margin-top:20px;
  padding:15px;
  background:white;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>
📷 바코드 스캔 테스트
</h2>

<button onclick="startScanner()">
스캔 시작
</button>

<div id="reader"></div>

<div class="result">

스캔결과

<div id="scanResult">
없음
</div>

</div>

</div>

<script>

let scanner;

function startScanner(){

  if(scanner){

    scanner.stop()
      .catch(()=>{});

  }

  scanner =
    new Html5Qrcode(
      "reader"
    );

  scanner.start(

    {
      facingMode:"environment"
    },

    {
      fps:10,
      qrbox:250
    },

    function(decodedText){

      document
        .getElementById(
          "scanResult"
        )
        .innerText =
          decodedText;

      scanner.stop();

    },

    function(error){

    }

  ).catch(err=>{

    alert(
      "카메라 실행 실패\n\n"
      + err
    );

    console.log(err);

  });

}

</script>

</body>
</html>
